services:
  influxdb:
    image: influxdb:2
    ports:
      - 8086:8086
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=password
      - DOCKER_INFLUXDB_INIT_ORG=infm
      - DOCKER_INFLUXDB_INIT_BUCKET=timeseries
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=password
    volumes:
      - "./data/influxdb2_data/config:/etc/influxdb2"
      - "./data/influxdb2_data/data:/var/lib/influxdb2"

  mqtt-simulator:
    # MQTT simulator that publishes sensor data (from the MQTT lecture)
    build: ./mqtt-simulator
    depends_on:
      - mqtt-broker
    develop:
      watch:
        - action: sync+restart
          path: ./mqtt-simulator
          target: /usr/src/app
          initial_sync: true

  mqtt-broker:
    # MQTT broker
    image: eclipse-mosquitto:latest
    ports:
      - "1883:1883" # MQTT (default)
      - "8083:8083" # MQTT over WebSockets
    volumes:
      - ./data/mosquitto-data:/mosquitto/data
      - ./data/mosquitto-logs:/mosquitto/logs
      - ./data/mosquitto-config:/mosquitto/config

  node-red:
    # Node-RED instance (http://localhost:1880)
    image: nodered/node-red:latest
    depends_on:
      - mqtt-broker
    ports:
      - "1880:1880"
    volumes:
      - ./data/node-red-data:/data
    entrypoint: >
      sh -c "
        cd /data &&
        if [ ! -d node_modules/node-red-contrib-influxdb ]; then
          echo 'Installing node-red-contrib-influxdb..' &&
          npm install node-red-contrib-influxdb
        fi &&
        node-red --userDir /data
      "
  
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"   # Grafana web interface
    volumes:
      - ./data/grafana:/var/lib/grafana
    restart: unless-stopped